<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nouvura Motion</title>
  <meta name="description" content="Nouvura Motion — create animated explainer videos in your browser. Private, no account, exports MP4.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14161b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' blob: data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-src 'self' about: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p style="padding:2rem;font-family:sans-serif">Nouvura Motion needs JavaScript to run. Everything stays on your device.</p></noscript>

  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <aside id="left" class="sidebar left" aria-label="Library"></aside>
    <main id="stage" class="stage-wrap" aria-label="Preview"></main>
    <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
    <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize timeline" title="Drag to resize the timeline"></div>
    <section id="timeline" class="timeline" aria-label="Timeline"></section>
  </div>

  <div id="splash" class="splash" role="status">
    <div class="splash-box"><img src="assets/logo.svg" alt="" width="48" height="48"><strong>Nouvura Motion</strong><span>Loading your studio…</span></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/model.js"></script>
  <script src="js/store.js"></script>
  <script src="js/svgtools.js"></script>
  <script src="js/media.js"></script>
  <script src="js/infographics.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui-canvas.js"></script>
  <script src="js/ui-library.js"></script>
  <script src="js/ui-inspector.js"></script>
  <script src="js/ui-timeline.js"></script>
  <script src="js/ui-header.js"></script>
  <script src="js/ui-export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
